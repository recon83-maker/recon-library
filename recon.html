<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recon Library - Local Build</title>
<style>
  :root {
    --primary-blue: #0077ff;
    --dark-bg: #050505;
    --card-bg: #111111;
    --text-color: #e0e0e0;
  }

  body, html {
    margin: 0; padding: 0;
    background-color: var(--dark-bg);
    color: var(--text-color);
    font-family: 'Segoe UI', Roboto, sans-serif;
    height: 100%; width: 100%;
    overflow-x: hidden;
  }

  /* Audio Control */
  #muteBtn {
    position: fixed; bottom: 20px; right: 20px; z-index: 2000;
    background: rgba(0, 0, 0, 0.7); border: 1px solid var(--primary-blue);
    color: var(--primary-blue); padding: 10px 15px; cursor: pointer;
    text-transform: uppercase; font-size: 0.7rem; font-weight: bold;
    letter-spacing: 2px; display: none;
  }

  /* Launcher */
  #launcherView {
    height: 100vh; display: flex; flex-direction: column;
    justify-content: center; align-items: center; cursor: pointer;
    text-align: center; background: #000;
  }

  .entry-text {
    color: var(--primary-blue); text-transform: uppercase;
    letter-spacing: 5px; font-size: 2.2rem; animation: pulse 2s infinite;
    font-weight: bold;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.4; text-shadow: 0 0 0px var(--primary-blue); }
    50% { opacity: 1; text-shadow: 0 0 20px var(--primary-blue); }
  }

  /* Library Grid */
  #libraryView { display: none; padding: 20px; min-height: 100vh; }
  header { text-align: center; padding: 10px 0; }
  h1 { font-size: 2.8rem; text-transform: uppercase; letter-spacing: 6px; color: #fff; text-shadow: 0 0 15px rgba(0, 119, 255, 0.7); margin: 0; }
  
  .filter-container { margin: 20px 0; display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
  .filter-btn { background: transparent; color: var(--text-color); border: 1px solid #333; padding: 10px 25px; cursor: pointer; text-transform: uppercase; font-size: 0.75rem; font-weight: bold; transition: 0.3s; }
  .filter-btn.active, .filter-btn:hover { border-color: var(--primary-blue); color: var(--primary-blue); background: rgba(0, 119, 255, 0.1); }
  
  .search-container { max-width: 500px; margin: 0 auto 30px; }
  #bookSearch { width: 100%; background: #000; border: 1px solid #333; border-left: 4px solid var(--primary-blue); padding: 14px 18px; color: #fff; outline: none; box-sizing: border-box; }

  .book-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 30px; max-width: 1200px; margin: 20px auto; }
  .book-card { background: var(--card-bg); border: 1px solid #222; border-radius: 4px; overflow: hidden; display: flex; flex-direction: column; transition: 0.3s; }
  .book-card:hover { border-color: var(--primary-blue); transform: translateY(-8px); }
  .book-cover { width: 100%; height: 380px; object-fit: cover; background: #222; }
  .book-info { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; }
  .btn-read { width: 100%; background: transparent; border: 2px solid var(--primary-blue); color: #fff; padding: 10px 0; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-top: auto; }

  /* Reader */
  #readerView { display: none; height: 100vh; width: 100%; position: fixed; top: 0; left: 0; z-index: 1000; background: var(--dark-bg); }
  .nav-bar { height: 60px; background: #111; display: flex; align-items: center; padding: 0 20px; border-bottom: 2px solid var(--primary-blue); }
  iframe { width: 100%; height: calc(100vh - 62px); border: none; }
  .hidden { display: none !important; }
</style>
</head>
<body>

  <audio id="bgMusic" loop preload="auto">
    <source src="https://drive.google.com/uc?export=download&id=1RBO1Gxm6qX6NqZKwOOnZiNkFDmpR9Bgn" type="audio/mpeg">
  </audio>

  <button id="muteBtn" onclick="toggleMute()">MUTE AUDIO</button>

  <div id="launcherView" onclick="showLibrary()">
    <div class="entry-text">SYSTEM READY</div>
    <p style="color: #555; letter-spacing: 2px; text-transform: uppercase; margin-top: 15px;">Accessing Local Archives</p>
  </div>

  <div id="libraryView">
    <header>
      <h1>Recon Library</h1>
      <div class="filter-container">
        <button class="filter-btn active" onclick="filterCategory('all', this)">All</button>
        <button class="filter-btn" onclick="filterCategory('books', this)">Books</button>
        <button class="filter-btn" onclick="filterCategory('manga', this)">Manga</button>
        <button class="filter-btn" onclick="filterCategory('comics', this)">Comics</button>
      </div>
      <div class="search-container">
        <input type="text" id="bookSearch" placeholder="SEARCHING ARCHIVES..." onkeyup="runFilters()">
      </div>
    </header>

    <section class="book-grid" id="libraryGrid">
      
      <div class="book-card" data-category="books">
        <img src="slacker.jpg" class="book-cover">
        <div class="book-info">
          <h2 style="font-size: 0.9rem; color: #fff;">Slacker</h2>
          <button class="btn-read" onclick="openReader('https://heyzine.com/flip-book/fadff3383f.html', 'Slacker')">Read Now</button>
        </div>
      </div>

      <div class="book-card" data-category="comics">
        <img src="starwars2.webp" class="book-cover">
        <div class="book-info">
          <h2 style="font-size: 0.9rem; color: #fff;">Rise of the Sith Vol. 2</h2>
          <button class="btn-read" onclick="openReader('https://heyzine.com/flip-book/6abc4647df.html', 'Rise of the Sith Vol. 2')">Read Now</button>
        </div>
      </div>

      <div class="book-card" data-category="manga">
        <img src="https://m.media-amazon.com/images/I/81S8As9xrML.jpg" class="book-cover">
        <div class="book-info">
          <h2 style="font-size: 0.9rem; color: #fff;">Jujutsu Kaisen 30 in 1</h2>
          <button class="btn-read" onclick="openReader('https://heyzine.com/flip-book/220e3b3699.html', 'Jujutsu Kaisen')">Read Now</button>
        </div>
      </div>

      <div class="book-card" data-category="comics">
        <img src="https://m.media-amazon.com/images/I/915uS6S8p5L.jpg" class="book-cover">
        <div class="book-info">
          <h2 style="font-size: 0.9rem; color: #fff;">Invincible: Compendium One</h2>
          <button class="btn-read" onclick="openReader('https://heyzine.com/flip-book/93cb65af18.html', 'Invincible Vol 1')">Read Now</button>
        </div>
      </div>

      <div class="book-card" data-category="comics">
        <img src="https://m.media-amazon.com/images/I/71sGkh+82DL.jpg" class="book-cover">
        <div class="book-info">
          <h2 style="font-size: 0.9rem; color: #fff;">Invincible: Compendium Two</h2>
          <button class="btn-read" onclick="openReader('https://heyzine.com/flip-book/68ac957f68.html', 'Invincible Vol 2')">Read Now</button>
        </div>
      </div>

      <div class="book-card" data-category="comics">
        <img src="https://m.media-amazon.com/images/I/71KppFunS-L.jpg" class="book-cover">
        <div class="book-info">
          <h2 style="font-size: 0.9rem; color: #fff;">Invincible: Compendium Three</h2>
          <button class="btn-read" onclick="openReader('https://heyzine.com/flip-book/29861c9076.html', 'Invincible Vol 3')">Read Now</button>
        </div>
      </div>

    </section>
  </div>

  <div id="readerView">
    <div class="nav-bar">
      <button onclick="closeReader()" style="background:transparent; border:1px solid var(--primary-blue); color:#fff; padding:8px 15px; cursor:pointer;">&larr; BACK</button>
      <span id="topNavTitle" style="margin-left:20px; color:#fff; text-transform:uppercase;"></span>
    </div>
    <iframe id="comicReader" src=""></iframe>
  </div>

  <script>
    const music = document.getElementById('bgMusic');
    const muteBtn = document.getElementById('muteBtn');

    function showLibrary() {
      document.getElementById('launcherView').style.display = 'none';
      document.getElementById('libraryView').style.display = 'block';
      muteBtn.style.display = 'block';
      music.volume = 0.4;
      music.play().catch(() => { console.log("User must interact with page first"); });
    }

    function toggleMute() {
      music.muted = !music.muted;
      muteBtn.innerText = music.muted ? "UNMUTE AUDIO" : "MUTE AUDIO";
    }

    function filterCategory(category, btn) {
      let btns = document.getElementsByClassName('filter-btn');
      for (let b of btns) b.classList.remove('active');
      btn.classList.add('active');
      let cards = document.getElementsByClassName('book-card');
      for (let card of cards) {
        let cat = card.getAttribute('data-category');
        card.classList.toggle('hidden', category !== 'all' && cat !== category);
      }
    }

    function runFilters() {
      let search = document.getElementById('bookSearch').value.toLowerCase();
      let cards = document.getElementsByClassName('book-card');
      for (let card of cards) {
        let title = card.querySelector('.book-info h2').innerText.toLowerCase();
        card.classList.toggle('hidden', !title.includes(search));
      }
    }

    function openReader(url, title) {
      document.getElementById('libraryView').style.display = 'none';
      document.getElementById('readerView').style.display = 'block';
      document.getElementById('comicReader').src = url;
      document.getElementById('topNavTitle').innerText = title;
      window.scrollTo(0, 0);
    }

    function closeReader() {
      document.getElementById('readerView').style.display = 'none';
      document.getElementById('libraryView').style.display = 'block';
      document.getElementById('comicReader').src = "";
    }
  </script>
</body>
</html>
